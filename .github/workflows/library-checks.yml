name: Library Checks

on:
  push:
    paths:
      - "aioaquarea/**"
      - "tests/**"
      - "pyproject.toml"
      - "Pipfile"
      - "Pipfile.lock"
      - ".github/workflows/library-checks.yml"
  pull_request:
    paths:
      - "aioaquarea/**"
      - "tests/**"
      - "pyproject.toml"
      - "Pipfile"
      - "Pipfile.lock"
      - ".github/workflows/library-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m black --check aioaquarea tests
      - run: python -m isort --check-only aioaquarea tests
      - name: Check for fatal and error-level lint regressions
        run: python -m pylint --errors-only aioaquarea

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify the typed marker is included in the wheel
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")
          assert len(wheel) == 1, wheel
          with zipfile.ZipFile(wheel[0]) as archive:
              assert "aioaquarea/py.typed" in archive.namelist()
          PY
