name: Library Checks

on:
  push:
    paths:
      - "aioaquarea/**"
      - "tests/**"
      - "pyproject.toml"
      - "Pipfile"
      - "Pipfile.lock"
      - ".github/workflows/library-checks.yml"
  pull_request:
    paths:
      - "aioaquarea/**"
      - "tests/**"
      - "pyproject.toml"
      - "Pipfile"
      - "Pipfile.lock"
      - ".github/workflows/library-checks.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp strenum bs4 black isort pylint pytest pytest-asyncio

      - name: Check formatting
        run: |
          python -m black --check aioaquarea tests
          python -m isort --check-only aioaquarea tests

      - name: Run library tests
        run: python -m pytest tests -q

      - name: Run pylint
        run: python -m pylint aioaquarea
