name: Backup Restorability Phase 1

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: read

concurrency:
  group: restore-drill-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-restore:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: heatpump-optimizer
    env:
      RUN_DOCKER_RESTORE_TESTS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing drill test dependencies
        run: python -m pip install -c constraints.txt "pytest>=8.0" "pytest-asyncio>=0.23"
      - name: Check restore scripts
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/restore_db.sh scripts/restore_archive.sh scripts/verify_backup.sh
          else
            echo "shellcheck NOT_RUN: tool unavailable"
          fi
      # Synthetic archive and expected marker are both reviewed head 037.
      # Real backup expectations below remain explicit per-archive configuration.
      - name: Synthetic Timescale restore and worker release gate
        run: >-
          python -m pytest tests/test_restore_db.py tests/test_verify_backup.py
          tests/test_restore_db_integration.py --noconftest -q -s
          --basetemp="${{ runner.temp }}/restore-drill"
          -o cache_dir="${{ runner.temp }}/restore-pytest-cache"

  weekly-real-restore:
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, linux, restore-drill]
    timeout-minutes: 65
    defaults:
      run:
        working-directory: heatpump-optimizer
    env:
      RUN_DOCKER_RESTORE_TESTS: "1"
      RUN_REAL_BACKUP_RESTORE_TESTS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      RESTORE_REAL_BACKUP_DIR: ${{ vars.RESTORE_DRILL_BACKUP_DIR }}
      RESTORE_REAL_EXPECTED_REVISION: ${{ vars.RESTORE_DRILL_EXPECTED_REVISION }}
      RESTORE_VERIFY_TMPFS_BYTES: ${{ vars.RESTORE_DRILL_TMPFS_BYTES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require explicitly configured read-only backup access and capacity
        run: |
          test -n "$RESTORE_REAL_BACKUP_DIR"
          test -n "$RESTORE_REAL_EXPECTED_REVISION"
          test -n "$RESTORE_VERIFY_TMPFS_BYTES"
          test -d "$RESTORE_REAL_BACKUP_DIR"
      - name: Install existing drill test dependencies
        run: python -m pip install -c constraints.txt "pytest>=8.0" "pytest-asyncio>=0.23"
      - name: Restore latest real archive on tmpfs
        run: >-
          python -m pytest
          tests/test_restore_db_integration.py::test_BK_13_latest_real_backup_restores_without_filters_or_errors
          --noconftest -q -s --basetemp="${{ runner.temp }}/real-restore-drill"
          -o cache_dir="${{ runner.temp }}/restore-pytest-cache"