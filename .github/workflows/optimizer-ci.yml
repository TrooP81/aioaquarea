name: Heat Pump Optimizer CI

on:
  pull_request:
    paths:
      - "heatpump-optimizer/**"
      - ".github/workflows/optimizer-ci.yml"
  push:
    branches: [main]
    paths:
      - "heatpump-optimizer/**"
      - ".github/workflows/optimizer-ci.yml"

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    env:
      MODEL_DIR: ${{ runner.temp }}/heatpump-optimizer-models
    defaults:
      run:
        working-directory: heatpump-optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: heatpump-optimizer/pyproject.toml
      - run: python -m pip install -e ".[all,dev]"
      - run: python -m ruff check packages tests migrations
      - run: python -m ruff format --check packages tests migrations
      - name: Run unit tests
        run: python -m pytest tests --ignore=tests/e2e -q

  backend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heatpump-optimizer
    env:
      DATABASE_URL: postgresql+asyncpg://heatpump:heatpump_test@localhost:5432/heatpump_test
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: timescale/timescaledb@sha256:15e00162766bd6f0019afaad4e57b850dcf882de5909bd7633899eebd4c03d57
        env:
          POSTGRES_DB: heatpump_test
          POSTGRES_USER: heatpump
          POSTGRES_PASSWORD: heatpump_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heatpump -d heatpump_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: heatpump-optimizer/pyproject.toml
      - run: python -m pip install -e ".[all,dev]"
      - name: Verify migration graph
        run: python -m alembic heads
      - name: Apply and compare database schema
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade 020
          python -m alembic upgrade head
          python -m alembic check
      - name: Run database-backed E2E tests
        run: python -m pytest tests/e2e -q

  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, mobile-chrome]
    defaults:
      run:
        working-directory: heatpump-optimizer/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: heatpump-optimizer/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: heatpump-optimizer/web/playwright-report
          if-no-files-found: ignore

  supply-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heatpump-optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: heatpump-optimizer/pyproject.toml
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[all,dev]" pip-audit
      - run: python -m pip_audit
      - name: Prepare Compose validation environment
        run: cp .env.example .env
      - run: docker compose config -q
      - uses: anchore/sbom-action@v0
        with:
          path: heatpump-optimizer
          format: spdx-json
          output-file: heatpump-optimizer/sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: heatpump-optimizer-sbom-spdx
          path: heatpump-optimizer/sbom.spdx.json
          if-no-files-found: error
