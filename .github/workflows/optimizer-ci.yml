name: Heat Pump Optimizer CI

on:
  pull_request:
    paths:
      - "heatpump-optimizer/**"
      - ".github/workflows/optimizer-ci.yml"
  push:
    branches: [main]
    paths:
      - "heatpump-optimizer/**"
      - ".github/workflows/optimizer-ci.yml"

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: heatpump-optimizer
    env:
      APP_ENVIRONMENT: test
      API_TOKEN: test-token
      SECRET_KEY: deployment-verify-public-test-secret
      DATABASE_URL: postgresql+asyncpg://heatpump:heatpump_test@127.0.0.1:5433/heatpump_test
      REDIS_URL: redis://127.0.0.1:6380/0
      PRICE_PROVIDER: entsoe
      ENTSOE_API_TOKEN: test-token
      ENTSOE_AREA: 10Y1001A1001A46L
      AQUAREA_USERNAME: test@test.com
      AQUAREA_PASSWORD: testpass
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/heatpump-optimizer
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Export owned unit model directory
        run: echo "MODEL_DIR=$RUNNER_TEMP/hpo-unit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/models" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            heatpump-optimizer/pyproject.toml
            heatpump-optimizer/constraints.txt
      - run: python -m pip install -c constraints.txt -e ".[all,dev]"
      - run: python -m pip install -c constraints.txt --no-deps tzdata==2026.4
      - name: Prepare disposable unit profile
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py prepare-unit
      - name: Lint backend
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py unit-phase lint -m ruff check packages tests migrations
      - name: Check backend formatting
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py unit-phase format -m ruff format --check packages tests migrations
      - name: Run unit tests
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py unit-phase unit -m pytest tests --ignore=tests/e2e -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hpo-unit-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          if-no-files-found: error

  backend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: heatpump-optimizer
    env:
      DATABASE_URL: postgresql+asyncpg://heatpump:heatpump_test@127.0.0.1:5433/heatpump_test
      REDIS_URL: redis://127.0.0.1:6380/0
      APP_ENVIRONMENT: test
      API_TOKEN: test-token
      SECRET_KEY: deployment-verify-public-test-secret
      PRICE_PROVIDER: entsoe
      ENTSOE_API_TOKEN: test-token
      ENTSOE_AREA: 10Y1001A1001A46L
      TIBBER_API_TOKEN: ""
      AQUAREA_USERNAME: test@test.com
      AQUAREA_PASSWORD: testpass
      LATITUDE: "59.3293"
      LONGITUDE: "18.0686"
      COP_MANUAL_TEST_OWNED: cop-manual-mon-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/heatpump-optimizer
      PYTHONDONTWRITEBYTECODE: "1"
    services:
      postgres:
        image: timescale/timescaledb@sha256:15e00162766bd6f0019afaad4e57b850dcf882de5909bd7633899eebd4c03d57
        env:
          POSTGRES_DB: heatpump_test
          POSTGRES_USER: heatpump
          POSTGRES_PASSWORD: heatpump_test
        ports:
          - "127.0.0.1:5433:5432"
        options: >-
          --health-cmd "pg_isready -U heatpump -d heatpump_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 18
      redis:
        image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
        ports:
          - "127.0.0.1:6380:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Export owned e2e model directory
        run: echo "MODEL_DIR=$RUNNER_TEMP/cop-manual-mon-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/models" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            heatpump-optimizer/pyproject.toml
            heatpump-optimizer/constraints.txt
      - run: python -m pip install -c constraints.txt -e ".[all,dev]"
      - run: python -m pip install -c constraints.txt --no-deps tzdata==2026.4
      - name: Prove owned job services and prepare test profile
        env:
          COP_MANUAL_TEST_SERVICE_CONTEXT: ${{ toJSON(job.services) }}
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py prepare
      - name: Collect complete manual verification inventory
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase manual-inventory -m pytest --noconftest tests/e2e/test_manual_cop_postgresql.py --collect-only -q
      # The seal partitions this complete E2E inventory into disjoint owned phases.
      # Inventory collects with --noconftest; only the ordinary phase keeps conftest.
      - name: Collect complete E2E verification inventory
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase e2e-inventory -m pytest --noconftest tests/e2e --collect-only -q
      - name: Verify migration graph
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase heads -m alembic heads
      - name: Verify legacy reversibility and retained migration refusal
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase migration -m pytest --noconftest tests/e2e/test_manual_cop_postgresql.py::TestManualCOPPostgreSQLMigration -q
      - name: Apply discovered head
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase upgrade-head -m alembic upgrade head
      - name: Compare schema after migration
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase check-migration -m alembic check
      - name: Run calendar, ownership, API and committed reset tests
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase manual -m pytest --noconftest tests/e2e/test_manual_cop_postgresql.py -k "not TestManualCOPPostgreSQLMigration and not test_sequence_exhaustion_is_503_and_never_wraps" -q
      - name: Compare schema after manual tests
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase check-manual -m alembic check
      - name: Verify sequence exhaustion as last manual mutation
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase exhaustion -m pytest --noconftest tests/e2e/test_manual_cop_postgresql.py::TestManualCOPPostgreSQLAPI::test_sequence_exhaustion_is_503_and_never_wraps -q
      - name: Compare schema after exhaustion
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase check-exhaustion -m alembic check
      # OBS-5 runs here on this prepared profile and canonical source manifest only;
      # tests/e2e/run_obs5_verification.ps1 is UNSUPPORTED (fixed historical fingerprint).
      - name: Verify OBS-5 genuine 032/033 migration on an owned child database
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase obs5-real-migration -m pytest --noconftest tests/e2e/test_ml_lifecycle_verification.py::TestOBS5RealMigration -q
      - name: Prove guarded primary head before OBS-5 lifecycle phases
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py primary-head obs5-primary
      - name: Run original OBS-5 lifecycle PostgreSQL tests
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase obs5-pg-original -m pytest --noconftest tests/e2e/test_ml_lifecycle_postgresql.py -q
      - name: Run supplementary OBS-5 lifecycle PostgreSQL tests
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase obs5-pg-supplement -m pytest --noconftest tests/e2e/test_ml_lifecycle_verification.py -k "not TestOBS5RealMigration" -q
      - name: Compare schema after OBS-5 lifecycle tests
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase check-obs5 -m alembic check
      - name: Run remaining database-backed E2E tests
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase ordinary -m pytest tests/e2e --ignore=tests/e2e/test_manual_cop_postgresql.py --ignore=tests/e2e/test_ml_lifecycle_postgresql.py --ignore=tests/e2e/test_ml_lifecycle_verification.py -q
      - name: Compare schema after ordinary E2E teardown
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py phase check-ordinary -m alembic check
      - name: Reconcile node inventory and seal verification receipts
        run: timeout --signal=TERM --kill-after=10s 660s python tests/e2e/test_manual_cop_postgresql.py seal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-e2e-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cop-manual-mon-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, mobile-chrome]
    defaults:
      run:
        working-directory: heatpump-optimizer/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: heatpump-optimizer/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - name: Build standalone web runtime image
        run: docker build --tag heatpump-optimizer-web-e2e:ci .
      - name: Start standalone web runtime
        run: docker run --detach --rm --name heatpump-optimizer-web-e2e --publish 3100:3000 heatpump-optimizer-web-e2e:ci
      - name: Wait for standalone web runtime
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3100/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs heatpump-optimizer-web-e2e
          exit 1
      - name: Smoke test standalone web runtime
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
        run: npx playwright test e2e/dashboard.spec.ts --project=${{ matrix.project }} --grep "loads and shows header"
      - name: Stop standalone web runtime
        if: always()
        run: docker stop heatpump-optimizer-web-e2e || true
      - name: Run Playwright suite
        run: npm run test:e2e -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: heatpump-optimizer/web/playwright-report
          if-no-files-found: ignore

  supply-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heatpump-optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            heatpump-optimizer/pyproject.toml
            heatpump-optimizer/constraints.txt
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -c constraints.txt -e ".[all,dev]" pip-audit
      - run: python -m pip_audit
      - name: Prepare Compose validation environment
        run: cp .env.example .env
      - run: docker compose config -q
      # anchore/sbom-action v0.24.2
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: heatpump-optimizer
          format: spdx-json
          output-file: heatpump-optimizer/sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: heatpump-optimizer-sbom-spdx
          path: heatpump-optimizer/sbom.spdx.json
          if-no-files-found: error
