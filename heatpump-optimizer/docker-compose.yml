services:
  db:
    # TimescaleDB 2.26.4, pinned by digest.  Existing installations created
    # with this extension version cannot be opened by an older server image.
    image: ${TIMESCALE_IMAGE:-timescale/timescaledb@sha256:15e00162766bd6f0019afaad4e57b850dcf882de5909bd7633899eebd4c03d57}
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine}
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: heatpump-optimizer/Dockerfile
      target: base
      args:
        APP_VERSION: ${APP_VERSION:-0.15.0}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
    command: [ "alembic", "upgrade", "head" ]
    restart: "no"
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  poller:
    build:
      context: ..
      dockerfile: heatpump-optimizer/Dockerfile
      target: base
      args:
        APP_VERSION: ${APP_VERSION:-0.15.0}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
    command: [ "python", "-m", "packages.poller.main" ]
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - modeldata:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  optimizer:
    build:
      context: ..
      dockerfile: heatpump-optimizer/Dockerfile
      target: base
      args:
        APP_VERSION: ${APP_VERSION:-0.15.0}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
    command: [ "python", "-m", "packages.optimizer.main" ]
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - modeldata:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: heatpump-optimizer/Dockerfile
      target: base
      args:
        APP_VERSION: ${APP_VERSION:-0.15.0}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
    command: [ "uvicorn", "packages.api.main:app", "--host", "0.0.0.0", "--port", "8500" ]
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - modeldata:/app/models
    ports:
      - "127.0.0.1:${API_PORT}:8500"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/health', timeout=3)" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.15.0}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
    ports:
      - "127.0.0.1:${WEB_PORT}:3000"
    environment:
      # Kept server-side by the Next route handler; never exposed as NEXT_PUBLIC.
      INTERNAL_API_URL: http://api:8500
      INTERNAL_API_TOKEN: ${API_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  backup:
    # Staged only. Activation (including the immediate first dump) needs approval.
    profiles: [ "backup" ]
    # Uses the same pinned PostgreSQL/Timescale image as the primary database,
    # so pg_dump and pg_restore always match the server major version. The
    # derived image adds only OpenSSL for optional encrypted replication.
    build:
      context: .
      dockerfile: Dockerfile.backup
      args:
        TIMESCALE_IMAGE: ${TIMESCALE_IMAGE:-timescale/timescaledb@sha256:15e00162766bd6f0019afaad4e57b850dcf882de5909bd7633899eebd4c03d57}
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-2592000}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-100}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-2764800}
      BACKUP_TIMEOUT_SECONDS: ${BACKUP_TIMEOUT_SECONDS:-3600}
      BACKUP_REPLICA_ENABLED: ${BACKUP_REPLICA_ENABLED:-false}
      BACKUP_REPLICA_DIR: /replica
      BACKUP_REPLICA_REQUIRED: ${BACKUP_REPLICA_REQUIRED:-false}
      BACKUP_REPLICA_ENCRYPTION_KEY: ${BACKUP_REPLICA_ENCRYPTION_KEY:-}
    command: [ "/bin/sh", "/scripts/backup_db.sh" ]
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./scripts/backup_db.sh:/scripts/backup_db.sh:ro
      - ./scripts/backup_status.sql:/scripts/backup_status.sql:ro
      - ./scripts/stage_backup.sh:/scripts/stage_backup.sh:ro
      - ${BACKUP_REPLICA_HOST_DIR:-./backups-replica}:/replica
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  restore-tool:
    profiles: [ "maintenance" ]
    image: timescale/timescaledb@sha256:15e00162766bd6f0019afaad4e57b850dcf882de5909bd7633899eebd4c03d57
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-heatpump}
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      PGDATABASE: ${POSTGRES_DB:-heatpump}
      RESTORE_DISPOSABLE: "false"
    entrypoint: []
    restart: "no"
    command: [ "/bin/sh", "-c", "echo 'Use scripts/restore_db.sh for guarded restores' >&2; exit 2" ]
    volumes:
      - ./backups:/backups:ro
      - ./scripts/restore_archive.sh:/scripts/restore_archive.sh:ro

volumes:
  pgdata:
  redisdata:
  modeldata:
