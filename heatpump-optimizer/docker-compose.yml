services:
  db:
    # TimescaleDB 2.26.4, pinned by digest.  Existing installations created
    # with this extension version cannot be opened by an older server image.
    image: ${TIMESCALE_IMAGE:-timescale/timescaledb@sha256:15e00162766bd6f0019afaad4e57b850dcf882de5909bd7633899eebd4c03d57}
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      # Local development defaults only. Override these explicitly for any
      # non-local deployment; this compose file binds every host port to loopback.
      POSTGRES_USER: ${POSTGRES_USER:-heatpump}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-heatpump}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heatpump}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952}
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: heatpump-optimizer/Dockerfile
      target: base
      args:
        APP_VERSION: ${APP_VERSION:-0.13.7}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
    command: [ "alembic", "upgrade", "head" ]
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-heatpump}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-heatpump}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      API_TOKEN: ${API_TOKEN:-disabled}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4444}
    depends_on:
      db:
        condition: service_healthy

  poller:
    build:
      context: ..
      dockerfile: heatpump-optimizer/Dockerfile
      target: base
      args:
        APP_VERSION: ${APP_VERSION:-0.13.7}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
    command: [ "python", "-m", "packages.poller.main" ]
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-heatpump}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-heatpump}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      API_TOKEN: ${API_TOKEN:-disabled}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4444}
    volumes:
      - modeldata:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  optimizer:
    build:
      context: ..
      dockerfile: heatpump-optimizer/Dockerfile
      target: base
      args:
        APP_VERSION: ${APP_VERSION:-0.13.7}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
    command: [ "python", "-m", "packages.optimizer.main" ]
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-heatpump}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-heatpump}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      API_TOKEN: ${API_TOKEN:-disabled}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4444}
    volumes:
      - modeldata:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: heatpump-optimizer/Dockerfile
      target: base
      args:
        APP_VERSION: ${APP_VERSION:-0.13.7}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
    command: [ "uvicorn", "packages.api.main:app", "--host", "0.0.0.0", "--port", "8500" ]
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-heatpump}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-heatpump}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      API_TOKEN: ${API_TOKEN:-disabled}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4444}
    volumes:
      - modeldata:/app/models
    ports:
      - "127.0.0.1:${API_PORT:-8500}:8500"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/health', timeout=3)" ]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.13.7}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
    ports:
      - "127.0.0.1:${WEB_PORT:-4444}:3000"
    environment:
      # Kept server-side by the Next route handler; never exposed as NEXT_PUBLIC.
      INTERNAL_API_URL: http://api:8500
      INTERNAL_API_TOKEN: ${API_TOKEN:-disabled}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  backup:
    # Uses the same pinned PostgreSQL/Timescale image as the primary database,
    # so pg_dump and pg_restore always match the server major version. The
    # derived image adds only OpenSSL for optional encrypted replication.
    build:
      context: .
      dockerfile: Dockerfile.backup
      args:
        TIMESCALE_IMAGE: ${TIMESCALE_IMAGE:-timescale/timescaledb@sha256:15e00162766bd6f0019afaad4e57b850dcf882de5909bd7633899eebd4c03d57}
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-heatpump}
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      PGDATABASE: ${POSTGRES_DB:-heatpump}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_VERIFY_AFTER_DUMP: ${BACKUP_VERIFY_AFTER_DUMP:-false}
      BACKUP_REPLICA_ENABLED: ${BACKUP_REPLICA_ENABLED:-false}
      BACKUP_REPLICA_DIR: /replica
      BACKUP_REPLICA_REQUIRED: ${BACKUP_REPLICA_REQUIRED:-false}
      BACKUP_REPLICA_ENCRYPTION_KEY: ${BACKUP_REPLICA_ENCRYPTION_KEY:-}
    command: [ "/bin/sh", "/scripts/backup_db.sh" ]
    volumes:
      - ./backups:/backups
      - ./scripts/backup_db.sh:/scripts/backup_db.sh:ro
      - ./scripts/verify_backup.sh:/scripts/verify_backup.sh:ro
      - ${BACKUP_REPLICA_HOST_DIR:-./backups-replica}:/replica
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup-verify:
    # Run manually with: docker compose --profile maintenance run --rm backup-verify
    profiles: [ "maintenance" ]
    build:
      context: .
      dockerfile: Dockerfile.backup
      args:
        TIMESCALE_IMAGE: ${TIMESCALE_IMAGE:-timescale/timescaledb@sha256:15e00162766bd6f0019afaad4e57b850dcf882de5909bd7633899eebd4c03d57}
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-heatpump}
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      PGDATABASE: ${POSTGRES_DB:-heatpump}
      BACKUP_DIR: /backups
      BACKUP_REPLICA_ENCRYPTION_KEY: ${BACKUP_REPLICA_ENCRYPTION_KEY:-}
    command: [ "/bin/sh", "/scripts/verify_backup.sh" ]
    volumes:
      - ./backups:/backups
      - ./scripts/verify_backup.sh:/scripts/verify_backup.sh:ro
      - ${BACKUP_REPLICA_HOST_DIR:-./backups-replica}:/replica
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  modeldata:
