# Docker Compose for E2E testing.
# Provides isolated PostgreSQL and Redis instances for test runs.

services:
  test-db:
    image: ${TIMESCALE_IMAGE:-timescale/timescaledb@sha256:15e00162766bd6f0019afaad4e57b850dcf882de5909bd7633899eebd4c03d57}
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: heatpump
      POSTGRES_PASSWORD: heatpump_test
      POSTGRES_DB: heatpump_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatpump -d heatpump_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data  # RAM disk for speed

  test-redis:
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine}
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
