[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
markers =
    asyncio: mark test as async
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
    error:coroutine .* was never awaited:RuntimeWarning
    ignore:Constructing LpVariable\(name, \.\.\.\) directly is deprecated.*:DeprecationWarning:pulp\.pulp
    ignore:PULP_CBC_CMD is deprecated and will be removed in PuLP 4\.0.*:DeprecationWarning:pulp\.apis\.coin_api
